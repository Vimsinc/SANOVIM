name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sanovim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sanovim_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (db libs + api-server + frontend)
        run: |
          pnpm run typecheck:libs
          pnpm --filter ./artifacts/api-server run typecheck
          pnpm --filter ./artifacts/sanovim run typecheck

      - name: Frontend unit tests
        run: pnpm --filter ./artifacts/sanovim run test

      - name: Build frontend
        run: pnpm --filter ./artifacts/sanovim run build

      - name: Build api-server
        run: pnpm --filter ./artifacts/api-server run build

      - name: Apply DB schema (drizzle push)
        run: pnpm --filter @workspace/db exec drizzle-kit push --force

      - name: Integration tests (real Postgres)
        run: pnpm --filter ./artifacts/api-server run test:integration

      - name: Smoke test (production server boots + routes resolve)
        run: pnpm --filter ./artifacts/api-server run test:smoke
